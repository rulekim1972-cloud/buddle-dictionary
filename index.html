<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b2a1e">
<title>버들 국어사전</title>
<style>
@font-face{font-family:Pre;src:url(Pretendard-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Pre;src:url(Pretendard-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
:root{
  --desk:#3b2a1e; --desk2:#2b1d14; --paper:#fbf6ea; --paper2:#f3ead6; --ink:#2a2420; --ink2:#6b5e52;
  --accent:#1f6f5c; --accent2:#e8f3ef; --red:#c4473a; --gold:#d79b2b; --cover:#1f5e50;
  --fs:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#5a4030,var(--desk) 55%,var(--desk2));font-family:Pre,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}

/* 위쪽 띠 */
#bar{position:fixed;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:30}
.chip{background:rgba(255,250,240,.12);color:#f8eedc;border:1px solid rgba(255,240,220,.22);border-radius:999px;height:38px;padding:0 15px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip:active{transform:scale(.96)}
.chip.on{background:#f8eedc;color:var(--desk)}
#title{color:#f8eedc;font-weight:700;font-size:17px;margin-right:auto;white-space:nowrap;opacity:.9}
#ribbon{position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:31;display:none;align-items:center;gap:12px;background:var(--paper);border-radius:14px;padding:6px 8px 6px 14px;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:calc(100vw - 16px)}
#ribbon.show{display:flex}
#ribbon .gname{font-size:13px;color:var(--ink2);font-weight:700;white-space:nowrap}
#ribbon .target{font-size:22px;font-weight:700;white-space:nowrap}
#ribbon .target small{font-size:14px;color:var(--ink2);font-weight:400;margin-left:6px}
#ribbon .clue{font-size:16px;max-width:46vw;line-height:1.35}
#ribbon .clue b{color:var(--accent)}
#ribbon .time{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--accent);min-width:54px;text-align:right}
#ribbon .time.late{color:var(--red)}
#ribbon .team{font-weight:700;color:#fff;border-radius:8px;padding:4px 10px;font-size:14px;white-space:nowrap}
#ribbon .hint{font-size:14px;color:#7a4b00;background:#fff3d6;border-radius:8px;padding:4px 8px;display:none;white-space:nowrap}
#ribbon .hint.show{display:block}
#ribbon .x{border:0;background:#eee3cf;border-radius:10px;height:34px;padding:0 10px;font-weight:700;color:var(--ink2)}

/* 책 */
#stage{position:fixed;left:0;right:0;top:52px;bottom:0;display:flex;align-items:center;justify-content:center}
#book{position:relative;touch-action:none}
.cover-back{position:absolute;inset:-10px -8px -12px -8px;background:linear-gradient(#24685a,#174b40);border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.pages{position:absolute;top:0;bottom:0;display:flex;perspective:2600px}
.page{position:relative;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .22  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),var(--paper);overflow:hidden;height:100%}
.page::after{content:"";position:absolute;inset:0;pointer-events:none}
.page.L::after{background:linear-gradient(to left,rgba(70,45,20,.34),rgba(70,45,20,.08) 4%,rgba(70,45,20,0) 12%),linear-gradient(to right,rgba(70,45,20,.08),rgba(70,45,20,0) 3%)}
.page.R::after{background:linear-gradient(to right,rgba(70,45,20,.34),rgba(70,45,20,.08) 4%,rgba(70,45,20,0) 12%),linear-gradient(to left,rgba(70,45,20,.08),rgba(70,45,20,0) 3%)}
.page.one::after{background:linear-gradient(to right,rgba(80,55,30,.16),rgba(80,55,30,0) 5%)}
.pin{position:absolute;inset:0;padding:calc(var(--fs)*2.6) calc(var(--fs)*1.5) calc(var(--fs)*2.2) calc(var(--fs)*1.6)}
.page.L .pin{padding-left:calc(var(--fs)*1.3);padding-right:calc(var(--fs)*1.9)}
.phead{position:absolute;left:calc(var(--fs)*1.4);right:calc(var(--fs)*1.4);top:calc(var(--fs)*.8);display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--fs)*.82);color:var(--ink2);border-bottom:1.5px solid #d9ccb3;padding-bottom:4px;font-weight:700}
.phead .g{color:var(--accent)}
.pfoot{position:absolute;bottom:calc(var(--fs)*.6);left:0;right:0;text-align:center;font-size:calc(var(--fs)*.78);color:var(--ink2)}
.pbody{height:100%;overflow:hidden;font-size:var(--fs);line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.ent{padding:3px 6px 3px 0;margin:0 -6px 5px;border-radius:8px;padding-left:calc(var(--fs)*.9 + 6px);text-indent:calc(var(--fs)*-.9);position:relative}
.ent .hw{font-weight:700;font-size:1.12em;color:#1d1a17}
.ent .hw sup{font-size:.6em;margin-left:1px;color:var(--ink2)}
.ent .pos{display:inline-block;text-indent:0;font-size:.74em;border:1px solid #cdbfa5;color:var(--ink2);border-radius:4px;padding:0 4px;margin:0 4px;line-height:1.35;vertical-align:2px}
.ent .g3{display:inline-block;text-indent:0;font-size:.68em;background:var(--accent2);color:var(--accent);border-radius:4px;padding:0 4px;margin-right:4px;vertical-align:2px;font-weight:700}
.ent .pic{font-size:1.05em;margin-right:3px}
.ent .n{color:var(--accent);font-weight:700;margin-right:2px}
.ent .ex{color:#5a5047}
.ent .ex::before{content:"예";display:inline-block;text-indent:0;font-size:.7em;background:#efe5d1;color:#7b6a55;border-radius:3px;padding:0 3px;margin:0 4px 0 3px;vertical-align:2px}
.ent .more{color:var(--ink2);font-size:.85em}
.ent:active{background:rgba(31,111,92,.08)}
.ent.hl{background:#ffe9a8;animation:hl 1.2s ease-in-out 3}
.ent.wrong{background:#ffd9d2}
.ent.found{background:#d6f0e4}
.ent.star .hw::after{content:"★";color:var(--gold);font-size:.75em;margin-left:3px}
@keyframes hl{50%{background:#fff6d8}}
.pbody.tight{font-size:calc(var(--fs)*.93);line-height:1.48}
.pbody.tight.tighter{font-size:calc(var(--fs)*.86);line-height:1.42}

/* 책 덩어리·옆면 색 띠·쪽 색인 */
.block{position:absolute;top:6px;bottom:-7px;border-radius:4px;background:repeating-linear-gradient(0deg,#efe5cf 0 1px,#d6c6a3 1px 2px);box-shadow:0 10px 18px rgba(0,0,0,.35)}
.edge .bands{position:absolute;inset:0;pointer-events:none}
.edge .bands i{position:absolute;opacity:.62;border-radius:1px}
.thumb{position:absolute;width:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;pointer-events:none;opacity:.9}
.thumb.tr{right:0;border-radius:4px 0 0 4px}
.thumb.tl{left:0;border-radius:0 4px 4px 0}
.cast{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4}
.cast.cr{background:linear-gradient(to right,rgba(40,25,10,.45),rgba(40,25,10,0) 55%)}
.cast.cl{background:linear-gradient(to left,rgba(40,25,10,.45),rgba(40,25,10,0) 55%)}
.leaf .face::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .22  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");pointer-events:none}
.phead{right:calc(var(--fs)*1.7)!important;left:calc(var(--fs)*1.7)!important}
/* 옆면 */
.edge{position:absolute;top:4px;bottom:4px;cursor:ew-resize}
.edge.L{border-radius:6px 0 0 6px}
.edge.R{border-radius:0 6px 6px 0}
.edge .lines{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#efe5cf 0 2px,#d8c9a9 2px 3px);box-shadow:inset 0 3px 4px rgba(0,0,0,.12),inset 0 -3px 4px rgba(0,0,0,.18)}
.edge.L .lines{border-radius:6px 0 0 6px}
.edge.R .lines{border-radius:0 6px 6px 0}
.edge .grip{position:absolute;top:50%;transform:translate(-50%,-50%);left:50%;color:#a8957a;font-size:11px;writing-mode:vertical-rl;letter-spacing:2px;pointer-events:none;font-weight:700;opacity:.8}

/* 색인 */
.tab{position:absolute;width:38px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .25s,right .25s;z-index:2}
.tab.R{border-radius:0 8px 8px 0}
.tab.L{border-radius:8px 0 0 8px}
.tab.flash{animation:flash .6s ease-in-out infinite alternate;z-index:3}
@keyframes flash{to{transform:scale(1.25);box-shadow:0 0 0 5px #ffe066,0 2px 8px rgba(0,0,0,.4)}}

/* 넘김 단추·안내 */
.corner{position:absolute;width:64px;height:64px;z-index:5;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:#4a3624;cursor:pointer}
.corner.R{background:linear-gradient(135deg,transparent 50%,#e3d2ae 50%,#c9b384);border-radius:0 0 4px 0;padding:18px 0 0 18px}
.corner.L{background:linear-gradient(225deg,transparent 50%,#e3d2ae 50%,#c9b384);border-radius:0 0 0 4px;padding:18px 18px 0 0}
.corner:active{filter:brightness(.92)}
#hint1{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:45;background:var(--accent);color:#fff;border-radius:16px;padding:14px 20px;font-size:19px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);line-height:1.5;animation:nudge 1.4s ease-in-out infinite}
#hint1 span{font-size:14px;opacity:.9}
@keyframes nudge{50%{transform:translateX(calc(-50% - 10px))}}
/* 넘기는 종이 */
.leaf{position:absolute;top:0;height:100%;transform-style:preserve-3d;z-index:10;pointer-events:none}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper)}
.leaf .back{transform:rotateY(180deg)}
.leaf .shade{position:absolute;inset:0;pointer-events:none;opacity:0}
.leaf .front .shade{background:linear-gradient(to left,rgba(0,0,0,.25),rgba(0,0,0,0) 40%)}
.leaf .back .shade{background:linear-gradient(to right,rgba(0,0,0,.25),rgba(0,0,0,0) 40%)}
.leaf.blank .face{background:linear-gradient(90deg,var(--paper2),var(--paper))}

/* 미리보기 말풍선 */
#peek{position:fixed;z-index:40;background:var(--ink);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;pointer-events:none;display:none;transform:translate(-50%,-120%);white-space:nowrap;font-size:16px;box-shadow:0 6px 14px rgba(0,0,0,.3)}
#peek .c{display:inline-block;background:#fff;color:var(--ink);border-radius:6px;padding:0 6px;margin-right:6px}
#peek small{opacity:.75;font-weight:400;margin-left:6px}

/* 표지 */
#cover{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#5a4030,var(--desk) 55%,var(--desk2));transition:opacity .5s}
#cover.hide{opacity:0;pointer-events:none}
.cv{width:min(78vw,430px);aspect-ratio:.72;background:linear-gradient(135deg,#2a7766,#1a5246);border-radius:6px 16px 16px 6px;box-shadow:inset 14px 0 0 rgba(0,0,0,.18),inset 16px 0 0 rgba(255,255,255,.08),0 24px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fbf3df;position:relative;padding:30px}
.cv .frame{pointer-events:none;position:absolute;inset:22px 22px 22px 34px;border:2px solid rgba(251,243,223,.45);border-radius:6px 10px 10px 6px}
.cv .sm{font-size:16px;letter-spacing:6px;opacity:.85}
.cv h1{font-size:clamp(40px,9vw,62px);margin:14px 0 6px;letter-spacing:4px}
.cv .sub{font-size:15px;opacity:.85}
.cv .who{position:absolute;bottom:52px;font-size:17px;font-weight:700;letter-spacing:1px}
.cv .open{margin-top:34px;background:#fbf3df;color:#1a5246;border:0;border-radius:999px;font-size:20px;font-weight:700;padding:14px 34px;box-shadow:0 6px 0 #c9b98f}
.cv .open:active{transform:translateY(3px);box-shadow:0 3px 0 #c9b98f}
.cv .load{margin-top:18px;font-size:14px;opacity:.8;height:18px}

/* 패널 (쪽지, 메뉴) */
.dim{position:fixed;inset:0;background:rgba(20,12,6,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:14px}
.dim.show{display:flex}
.card{background:var(--paper);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.45);width:min(560px,100%);max-height:calc(100vh - 28px);overflow:auto;padding:22px 22px 18px;position:relative}
.card.wide{width:min(760px,100%)}
.card h2{margin:0 0 4px;font-size:24px}
.card h3{margin:18px 0 8px;font-size:16px;color:var(--ink2)}
.card .close{position:absolute;top:12px;right:12px;border:0;background:#eee3cf;width:40px;height:40px;border-radius:12px;font-size:20px;color:var(--ink2)}
.card p{line-height:1.6}
.note-top{display:flex;gap:16px;align-items:center;margin-right:40px}
.note-pic{font-size:72px;line-height:1;background:#fff;border-radius:18px;width:104px;height:104px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px #eadfc8;flex:none}
.note-w{font-size:34px;font-weight:700}
.note-w sup{font-size:16px;color:var(--ink2)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:13px;border-radius:6px;padding:3px 8px;background:#efe5d1;color:#6b5a45;font-weight:700}
.tag.g{background:var(--accent2);color:var(--accent)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;border-radius:12px;height:46px;padding:0 18px;font-size:16px;font-weight:700;background:#efe5d1;color:var(--ink)}
.btn.pri{background:var(--accent);color:#fff}
.btn.gold{background:#fff0c9;color:#7a4b00}
.btn:active{transform:scale(.97)}
.sense{padding:10px 12px;border-radius:12px;background:#fff;margin-top:8px;line-height:1.55;font-size:17px}
.sense .n{color:var(--accent);font-weight:700;margin-right:4px}
.sense .ex{color:#5a5047;margin-top:4px;font-size:16px}
.sense .ex::before{content:"예 ";color:#9c8b74;font-weight:700}
.rel{display:inline-flex;align-items:center;gap:4px;margin:6px 6px 0 0;border:0;border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700;background:#e8f3ef;color:var(--accent)}
.rel.anti{background:#fde9e5;color:#a0392d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gcard{border:0;border-radius:16px;background:#fff;padding:14px 12px;text-align:left;box-shadow:0 2px 0 #e3d6bd;min-height:110px}
.gcard .ic{font-size:30px}
.gcard b{display:block;font-size:17px;margin-top:4px}
.gcard span{font-size:13px;color:var(--ink2);line-height:1.4;display:block;margin-top:3px}
.gcard:active{transform:scale(.97)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.set{border:0;border-radius:12px;background:#fff;padding:10px 6px;box-shadow:0 2px 0 #e3d6bd;font-weight:700;font-size:16px}
.set small{display:block;font-weight:400;color:var(--ink2);font-size:12px;margin-top:3px}
.set.done{background:#e8f3ef}
.lvl{font-size:13px;font-weight:700;color:var(--ink2);margin:12px 0 6px}
.seg{display:inline-flex;background:#efe5d1;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;height:38px;padding:0 14px;font-weight:700;font-size:15px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
textarea,input[type=text]{width:100%;font-family:inherit;font-size:16px;border:2px solid #e0d3b9;border-radius:12px;padding:10px;background:#fff;color:var(--ink)}
.res-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#fff;margin-top:6px;font-size:16px}
.res-row .ok{color:var(--accent);font-weight:700}
.res-row .no{color:#a0392d;font-weight:700}
.res-row .w{font-weight:700;min-width:90px}
.res-row .meta{color:var(--ink2);font-size:14px;margin-left:auto}
.big-msg{font-size:22px;font-weight:700;margin:6px 0 2px}
.teams{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.team-box{flex:1;min-width:96px;border-radius:14px;color:#fff;padding:10px;text-align:center}
.team-box b{display:block;font-size:28px}
.stamp{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.st{aspect-ratio:1;border-radius:50%;border:3px dashed #d6c7a8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:#c1b192}
.st small{font-size:11px;font-weight:700}
.st.on{border:3px solid var(--red);color:var(--red);transform:rotate(-8deg);background:rgba(196,71,58,.06)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:0;background:#fff;border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700;box-shadow:0 1px 0 #e3d6bd}
/* 줄 세우기 */
.ord-slots{display:flex;gap:8px;margin:12px 0}
.slot{flex:1;min-height:64px;border-radius:12px;border:2px dashed #d6c7a8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:18px;background:#fffdf7}
.slot small{font-size:12px;color:var(--ink2)}
.slot.ok{border:2px solid var(--accent);background:#e8f3ef}
.slot.no{border:2px solid #d26b5e;background:#fde9e5}
.ord-cards{display:flex;gap:8px;flex-wrap:wrap;min-height:60px}
.ocard{border:0;border-radius:12px;background:#fff;box-shadow:0 3px 0 #e3d6bd;padding:12px 18px;font-size:20px;font-weight:700}
.ocard.used{visibility:hidden}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-size:17px;font-weight:700;opacity:0;transition:.25s;z-index:70;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.good{background:var(--accent)}
#toast.bad{background:#a0392d}
#qr canvas,#qr img{width:200px;height:200px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:12px}
.small{font-size:13px;color:var(--ink2);line-height:1.5}
.cele{position:fixed;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.cele i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-width:700px){#title{display:none}.chip{padding:0 11px;font-size:14px}}
</style>
</head>
<body>
<div id="cover">
  <div class="cv">
    <div class="frame"></div>
    <div class="sm">초등학생을 위한</div>
    <h1>버들<br>국어사전</h1>
    <div class="sub">넘기고 · 찾고 · 읽어 주는 사전</div>
    <button class="open" id="openBtn" disabled>사전 펼치기</button>
    <div class="load" id="loadMsg">사전을 준비하고 있어요…</div>
    <div class="who">3학년</div>
  </div>
</div>

<div id="bar">
  <div id="title">버들 국어사전</div>
  <button class="chip" id="bGame">🎲 놀이</button>
  <button class="chip" id="bDogam">📒 낱말 도감</button>
  <button class="chip" id="bSet">⚙️</button>
</div>
<div id="ribbon"></div>

<div id="stage"><div id="book"></div></div>
<div id="peek"></div>
<div id="toast"></div>
